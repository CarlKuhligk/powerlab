services:
  powerlab:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POWERLAB_VERSION: ${POWERLAB_VERSION:-dev}
    image: powerlab:${POWERLAB_VERSION:-dev}
    container_name: powerlab
    restart: unless-stopped
    ports:
      - "8889:8889"
    environment:
      POWERLAB_HOST: 0.0.0.0
      POWERLAB_PORT: 8889
      POWERLAB_DATA_DIR: /data
      POWERLAB_DATABASE_URL: sqlite:////data/powerlab.db
    volumes:
      - powerlab_data:/data
    # Linux: uncomment and adjust to the PPK2 measurement interface (if01).
    # See README: USB-Freigabe unter Ubuntu/Linux / Permission denied.
    # devices:
    #   - /dev/ttyACM1:/dev/ttyACM1:rwm
    # For a non-root container user, add the device's numeric group ID:
    # stat -c '%g' /dev/ttyACM1
    # group_add:
    #   - "20"  # Replace with the actual GID from the host.
    # Rootless Podman with crun: use keep-groups instead of the numeric GID.
    # The host user must already belong to the device's group (see README).
    # group_add:
    #   - keep-groups

volumes:
  powerlab_data:
